name: Docker

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dispatch-publish:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch trusted main publisher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Release ID must be a positive integer.'
            exit 1
          fi
          gh workflow run docker-publish.yml --ref main \
            -R "$GITHUB_REPOSITORY" -f release_id="$RELEASE_ID"
